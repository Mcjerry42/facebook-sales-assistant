# Render Blueprint — one-click deploy for MetaPilot.
#
# How to use:
#  1. Push this repo to GitHub.
#  2. On https://dashboard.render.com → "New +" → "Blueprint" → pick the repo.
#  3. Render reads this file, creates the service, and asks for the secrets below.
#  4. After the first deploy you get a URL like https://metapilot.onrender.com
#     Use that domain in:
#       - Facebook App → Messenger → Webhooks → Callback URL:
#           https://<your-app>.onrender.com/api/public/fb-webhook
#       - Facebook Login → Valid OAuth Redirect URIs (if used)
#     The dashboard "Facebook & API" page already builds the Callback URL from
#     window.location.origin, so it will display the Render URL automatically
#     once you open the dashboard from the deployed site.
services:
  - type: web
    name: metapilot
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install -g bun && bun install && bun run build
    startCommand: bunx wrangler dev --port $PORT --ip 0.0.0.0 --local
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LOVABLE_API_KEY
        sync: false